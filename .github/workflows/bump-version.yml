name: Bump project version

on:
  workflow_call:
    inputs:
      java-distro:
        description: 'Java flavor to use'
        default: 'temurin'
        type: string
      java-version:
        description: 'Java version to use'
        default: '21'
        type: string

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            accounts: folio-app-accounts/**
            transactions: folio-app-transactions/**
            
  bump:
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4.4.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distro }}
          cache: maven

      - name: Restore Maven cache
        uses: actions/cache@v4.2.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Update module to new version
        id: new-version
        run: |
          mvn -B versions:set -DnextSnapshot=true -DgenerateBackupPoms=false -B -ntp -f folio-app-${{ matrix.package }}/pom.xml
          git status