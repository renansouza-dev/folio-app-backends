name: Build and Push Docker Images

on:
  workflow_call:
    inputs:
      java-distro:
        description: 'Java flavor to use'
        default: 'temurin'
        type: string
      java-version:
        description: 'Java version to use'
        default: '21'
        type: string

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            accounts: folio-app-accounts/**
            transactions: folio-app-transactions/**

  build:
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Extract Version from pom.xml
        id: extract-version
        run: |
          VERSION=$(xmllint --xpath "string(//project/version)" folio-app-${{ matrix.module }}/pom.xml)
          CLEAN_VERSION=${VERSION%-SNAPSHOT}
          echo "version=$CLEAN_VERSION" >> $GITHUB_ENV

