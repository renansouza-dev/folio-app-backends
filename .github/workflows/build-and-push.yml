name: Build and Push Docker Images

on:
  workflow_call:
    inputs:
      java-distro:
        description: 'Java flavor to use'
        default: 'temurin'
        type: string
      java-version:
        description: 'Java version to use'
        default: '21'
        type: string
      secrets:
        SONAR_TOKEN:
          description: 'SonarCloud authentication token'
          required: true

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4.4.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distro }}
          cache: maven

      - name: Restore Maven cache
        uses: actions/cache@v4.2.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Changes
        id: changes
        run: |
          echo "changed_modules=" >> $GITHUB_ENV
          for module in folio-app-accounts folio-app-transactions; do
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "^$module/"; then
           echo "Module $module has changed."
           echo "changed_modules=${module} $changed_modules" >> $GITHUB_ENV
          fi
          done

      - name: Build and Push folio-app-accounts
        if: contains(env.changed_modules, 'folio-app-accounts')
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/folio-app-accounts:release-${{ github.run_number }} \
            -t ghcr.io/${{ github.repository }}/folio-app-accounts:latest \
            folio-app-accounts
          docker push ghcr.io/${{ github.repository }}/folio-app-accounts:release-${{ github.run_number }}
          docker push ghcr.io/${{ github.repository }}/folio-app-accounts:latest

      - name: Build and Push folio-app-transactions
        if: contains(env.changed_modules, 'folio-app-transactions')
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/folio-app-transactions:release-${{ github.run_number }} \
            -t ghcr.io/${{ github.repository }}/folio-app-transactions:latest \
            folio-app-transactions
          docker push ghcr.io/${{ github.repository }}/folio-app-transactions:release-${{ github.run_number }}
          docker push ghcr.io/${{ github.repository }}/folio-app-transactions:latest