name: Build and Push Docker Images

on:
  workflow_call:
    inputs:
      java-distro:
        description: 'Java flavor to use'
        default: 'temurin'
        type: string
      java-version:
        description: 'Java version to use'
        default: '21'
        type: string

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            accounts: folio-app-accounts/**
            transactions: folio-app-transactions/**

  publish:
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4.4.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distro }}
          cache: maven

      - name: Restore Maven cache
        uses: actions/cache@v4.2.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Apply and Extract version from pom.xml
        id: extract-version
        run: |
          mvn versions:set -DremoveSnapshot -DgenerateBackupPoms=false -f folio-app-${{ matrix.package }}/pom.xml -ntp
          VERSION=$(mvn help:evaluate -q -DforceStdout -D"expression=project.version" -f folio-app-${{ matrix.package }}/pom.xml -ntp)
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/folio-app-${{ matrix.package }}:${{ env.version }} \
            -t ghcr.io/${{ github.repository }}/folio-app-${{ matrix.package }}:latest \
            folio-app-${{ matrix.package }}
  security-check:
    runs-on: ubuntu-latest
    needs: [ detect-changes, publish ]
    strategy:
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/folio-app-${{ matrix.package }}:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
  commit-updated-pom:
    runs-on: ubuntu-latest
    needs: [ security-check ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit updated pom.xml
        run: |
          git add **/pom.xml
          git commit -m "Remove -SNAPSHOT from affected pom.xml"

      - name: Push changes to PR branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin ${{ github.event.pull_request.head.ref }}
  push-images:
    runs-on: ubuntu-latest
    needs: [ commit-updated-pom ]
    strategy:
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ github.repository }}/folio-app-${{ matrix.package }}:${{ needs.publish.outputs.version }}
          docker push ghcr.io/${{ github.repository }}/folio-app-${{ matrix.package }}:latest